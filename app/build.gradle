plugins {
    id 'com.android.application'
}

android {
    namespace 'com.edwardresearch.resonance'
    compileSdk 36

    defaultConfig {
        applicationId 'com.edwardresearch.resonance'
        minSdk 26
        targetSdk 36
        versionCode 5
        versionName '0.5.0'
    }

    buildTypes {
        debug { minifyEnabled false }
        release { minifyEnabled false }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
