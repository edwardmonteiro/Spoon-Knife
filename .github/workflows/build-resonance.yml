name: Build Resonance 0.6.1 APK

on:
  push:
    branches: [resonance-v0.6.1]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug
      - name: Prepare artifact
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/Resonance-0.6.1.apk
          sha256sum dist/Resonance-0.6.1.apk | tee dist/SHA256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: Resonance-0.6.1
          path: dist/
          if-no-files-found: error
