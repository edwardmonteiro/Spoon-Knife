name: BLUE Android APK

on:
  push:
    branches: [ "blue-android-v0" ]
    paths:
      - "blue-android/**"
      - ".github/workflows/blue-apk.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: blue-android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Verify Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          sdkmanager --list | head -40

      - name: Install SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build debug APK
        run: gradle assembleDebug --stacktrace

      - name: Collect APK
        run: cp app/build/outputs/apk/debug/app-debug.apk ../BLUE-v0-debug.apk

      - uses: actions/upload-artifact@v4
        with:
          name: BLUE-v0-debug
          path: BLUE-v0-debug.apk
          if-no-files-found: error
